<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>温暖空间 - SuperOS</title>
  <style>
    :root {
      --bg-main: #FAF9F6;
      --bg-card-1: #FAE2D8;
      --bg-card-2: #FDF1EB;
      --bg-card-3: #F5F1EE;
      --primary: #AA1E23;
      --primary-light: #74070E;
      --primary-dark: #4A0509;
      --text: #4A0509;
      --text-muted: #74070E;
      --border: rgba(170, 30, 35, 0.2);
      --warm-gradient: linear-gradient(135deg, #FAE2D8 0%, #FDF1EB 50%, #FAF9F6 100%);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      background: var(--warm-gradient);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
    }

    /* 浮动爱心动画 */
    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      color: rgba(170, 30, 35, 0.3);
      animation: float 15s infinite ease-in-out;
      opacity: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100px) translateX(100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(253, 241, 235, 0.8);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 15px rgba(170, 30, 35, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* 主容器 */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    /* 欢迎卡片 */
    .welcome-card {
      background: linear-gradient(135deg, rgba(250, 226, 216, 0.9), rgba(253, 241, 235, 0.9));
      border: 2px solid rgba(170, 30, 35, 0.2);
      border-radius: 24px;
      padding: 40px 30px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(170, 30, 35, 0.1);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-emoji {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }

    .welcome-message {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 20px;
    }

    /* 功能卡片网格 */
    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .activity-card {
      background: var(--bg-card-2);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: visible;
      animation: fadeInUp 0.8s ease-out;
      animation-fill-mode: both;
    }

    .activity-card:nth-child(1) { animation-delay: 0.1s; }
    .activity-card:nth-child(2) { animation-delay: 0.2s; }
    .activity-card:nth-child(3) { animation-delay: 0.3s; }
    .activity-card:nth-child(4) { animation-delay: 0.4s; }

    .activity-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(170, 30, 35, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .activity-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 40px rgba(170, 30, 35, 0.15);
      border-color: var(--primary);
    }

    .activity-card:hover::before {
      opacity: 1;
    }

    .activity-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
      animation: floatIcon 3s infinite ease-in-out;
    }

    @keyframes floatIcon {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .activity-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .activity-description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* 呼吸练习 */
    .breathing-exercise {
      background: var(--bg-card-2);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .breathing-exercise.active {
      display: block;
      animation: fadeInUp 0.5s ease-out;
    }

    .breathing-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      margin: 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: 600;
      box-shadow: 0 0 40px rgba(170, 30, 35, 0.3);
      transition: all 4s ease-in-out;
    }

    .breathing-circle.breathing-in {
      transform: scale(1.3);
    }

    .breathing-circle.breathing-out {
      transform: scale(1);
    }

    .breathing-instruction {
      font-size: 18px;
      color: var(--text);
      margin-top: 20px;
      font-weight: 500;
    }

    /* 鼓励卡片 */
    .encouragement-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .encouragement-card {
      background: var(--bg-card-1);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .encouragement-card:hover {
      transform: rotateY(5deg) scale(1.05);
      box-shadow: 0 8px 24px rgba(170, 30, 35, 0.2);
    }

    .encouragement-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.6;
    }

    /* 点击收集爱心游戏 */
    .heart-collector {
      background: var(--bg-card-2);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .heart-collector.active {
      display: block;
      animation: fadeInUp 0.5s ease-out;
    }

    .game-area {
      min-height: 300px;
      background: linear-gradient(135deg, rgba(250, 226, 216, 0.3), rgba(253, 241, 235, 0.3));
      border-radius: 16px;
      position: relative;
      margin: 20px 0;
      overflow: hidden;
    }

    .clickable-heart {
      position: absolute;
      font-size: 40px;
      cursor: pointer;
      animation: heartPop 0.5s ease-out;
      transition: transform 0.2s ease;
    }

    .clickable-heart:hover {
      transform: scale(1.2);
    }

    @keyframes heartPop {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .score {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin: 20px 0;
    }

    /* 每日励志语 */
    .daily-quote {
      background: linear-gradient(135deg, rgba(250, 226, 216, 0.8), rgba(253, 241, 235, 0.8));
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .quote-icon {
      font-size: 48px;
      color: var(--primary);
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .quote-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 12px;
    }

    .quote-author {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 按钮 */
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-block;
      margin: 8px;
    }

    .btn:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(170, 30, 35, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary);
    }

    .btn-secondary:hover {
      background: var(--bg-card-1);
      color: var(--primary-dark);
    }

    /* 关闭按钮 */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(170, 30, 35, 0.1);
      border: none;
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }
    
    /* 卡片内的呼吸练习样式 */
    .activity-card .breathing-circle {
      width: 180px;
      height: 180px;
      font-size: 20px;
      margin: 20px auto;
    }
    
    .activity-card .breathing-instruction {
      font-size: 16px;
      margin-top: 15px;
    }
    
    .activity-card h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .close-btn:hover {
      background: var(--primary);
      color: white;
      transform: rotate(90deg);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .activities-grid {
        grid-template-columns: 1fr;
      }

      .welcome-card {
        padding: 30px 20px;
      }

      .welcome-title {
        font-size: 24px;
      }

      .breathing-circle {
        width: 150px;
        height: 150px;
      }
    }

    /* 粒子效果 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(170, 30, 35, 0.3);
      border-radius: 50%;
      animation: particleFloat 20s infinite linear;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(100px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <!-- 浮动爱心 -->
  <div class="floating-hearts" id="floatingHearts"></div>
  
  <!-- 粒子效果 -->
  <div class="particles" id="particles"></div>

  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="logo-section">
      <div class="logo-circle">💝</div>
      <div class="logo-text">温暖空间</div>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="container">
    <!-- 欢迎卡片 -->
    <div class="welcome-card">
      <div class="welcome-emoji">💕</div>
      <h1 class="welcome-title">欢迎来到温暖空间</h1>
      <p class="welcome-message">
        我知道你最近压力很大，但请记住：你已经做得很棒了！<br>
        这里是一个充满爱和温暖的地方，你可以在这里放松、获得鼓励，或者只是简单地消磨时间。<br>
        无论何时，你都不是一个人。💖
      </p>
    </div>

    <!-- 活动卡片网格 -->
    <div class="activities-grid">
      <div class="activity-card" id="breathingCard" onclick="openBreathingExercise()">
        <span class="activity-icon">🌬️</span>
        <h3 class="activity-title">呼吸练习</h3>
        <p class="activity-description">跟随呼吸节奏，让心情平静下来</p>
      </div>

      <div class="activity-card">
        <span class="activity-icon">✨</span>
        <h3 class="activity-title">鼓励卡片</h3>
        <p class="activity-description" id="encouragementText">你比想象中更坚强！</p>
      </div>

      <div class="activity-card">
        <span class="activity-icon">📜</span>
        <h3 class="activity-title">每日励志</h3>
        <p class="activity-description" id="quoteTextCard">"每一个困难都是成长的机会，你已经走过了那么多路，未来也一定会更好。"</p>
      </div>
    </div>

    <!-- 每日励志语 -->
    <div class="daily-quote">
      <div class="quote-icon">💭</div>
      <p class="quote-text" id="quoteText">"每一个困难都是成长的机会，你已经走过了那么多路，未来也一定会更好。"</p>
      <p class="quote-author">— SuperOS 温暖空间</p>
    </div>


    <!-- 收集爱心游戏 -->
    <div class="heart-collector" id="heartCollector">
      <button class="close-btn" onclick="closeHeartCollector()">×</button>
      <h2 style="margin-bottom: 20px; color: var(--primary-dark);">💖 收集爱心</h2>
      <div class="score">收集数: <span id="heartScore">0</span> ❤️</div>
      <div class="game-area" id="gameArea"></div>
      <button class="btn" onclick="startHeartGame()">开始游戏</button>
    </div>
  </div>

  <script>
    // 鼓励话语库
    const encouragements = [
      "你比想象中更坚强！",
      "每一天都是新的开始，你值得拥有美好！",
      "你的努力一定会开花结果，相信自己！",
      "困难只是暂时的，但你的勇气是永恒的！",
      "你已经走了这么远，为什么不继续前进呢？",
      "每个人都有自己的节奏，不用和别人比较！",
      "你的存在本身就是一件美好的事！",
      "累了就休息，但不要放弃！",
      "今天的你已经很棒了，明天会更好！",
      "你拥有改变一切的力量，相信自己！"
    ];

    // 励志语录库
    const quotes = [
      { text: "每一个困难都是成长的机会，你已经走过了那么多路，未来也一定会更好。", author: "SuperOS 温暖空间" },
      { text: "不要担心你现在的压力，它们只是让你变得更强大的催化剂。", author: "SuperOS 温暖空间" },
      { text: "即使是最黑暗的夜晚，也会有黎明的到来。", author: "SuperOS 温暖空间" },
      { text: "你今天的努力，是明天成功的基石。", author: "SuperOS 温暖空间" },
      { text: "深呼吸，放松一下。你已经做得很好了。", author: "SuperOS 温暖空间" },
      { text: "压力只是生活的一部分，但你的笑容可以让一切变得美好。", author: "SuperOS 温暖空间" },
      { text: "记住，你不是一个人在战斗。我们都在这里支持你。", author: "SuperOS 温暖空间" },
      { text: "每一个微笑都是对困难的胜利。", author: "SuperOS 温暖空间" }
    ];

    // 初始化浮动爱心
    function initFloatingHearts() {
      const container = document.getElementById('floatingHearts');
      const heartSymbols = ['💕', '💖', '❤️', '💗', '💝'];
      
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDelay = Math.random() * 15 + 's';
        heart.style.animationDuration = (10 + Math.random() * 10) + 's';
        container.appendChild(heart);
      }
    }

    // 初始化粒子效果
    function initParticles() {
      const container = document.getElementById('particles');
      
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        container.appendChild(particle);
      }
    }

    // 呼吸练习
    let breathingInterval = null;
    let isBreathing = false;

    function openBreathingExercise() {
      const card = document.getElementById('breathingCard');
      card.innerHTML = `
        <button class="close-btn" onclick="closeBreathingExercise()">×</button>
        <h2 style="margin-bottom: 20px; color: var(--primary-dark);">🌬️ 呼吸练习</h2>
        <div class="breathing-circle" id="breathingCircle">吸</div>
        <p class="breathing-instruction" id="breathingInstruction">准备开始...</p>
        <button class="btn" id="breathingBtn" onclick="startBreathing()">开始练习</button>
      `;
      card.style.cursor = 'default';
      card.onclick = null;
      // 重置呼吸状态
      isBreathing = false;
      breathingInterval = null;
    }

    function closeBreathingExercise() {
      const card = document.getElementById('breathingCard');
      card.innerHTML = `
        <span class="activity-icon">🌬️</span>
        <h3 class="activity-title">呼吸练习</h3>
        <p class="activity-description">跟随呼吸节奏，让心情平静下来</p>
      `;
      card.style.cursor = 'pointer';
      card.onclick = openBreathingExercise;
      stopBreathing();
    }

    function startBreathing() {
      const btn = document.getElementById('breathingBtn');
      if (isBreathing) {
        stopBreathing();
        if (btn) btn.textContent = '开始练习';
        return;
      }

      isBreathing = true;
      if (btn) btn.textContent = '停止练习';
      const circle = document.getElementById('breathingCircle');
      const instruction = document.getElementById('breathingInstruction');
      let phase = 0; // 0: 吸气, 1: 屏息, 2: 呼气, 3: 休息

      breathingInterval = setInterval(() => {
        switch (phase % 4) {
          case 0: // 吸气 4秒
            circle.textContent = '吸';
            circle.classList.add('breathing-in');
            circle.classList.remove('breathing-out');
            instruction.textContent = '慢慢吸气... 感受气息充满你的身体';
            phase++;
            break;
          case 1: // 屏息 2秒
            instruction.textContent = '保持... 感受平静';
            phase++;
            break;
          case 2: // 呼气 6秒
            circle.textContent = '呼';
            circle.classList.remove('breathing-in');
            circle.classList.add('breathing-out');
            instruction.textContent = '慢慢呼气... 释放所有的压力和紧张';
            phase++;
            break;
          case 3: // 休息 2秒
            instruction.textContent = '休息一下... 准备下一次呼吸';
            phase++;
            break;
        }
      }, 2000);
    }

    function stopBreathing() {
      if (breathingInterval) {
        clearInterval(breathingInterval);
        breathingInterval = null;
      }
      isBreathing = false;
      const circle = document.getElementById('breathingCircle');
      const instruction = document.getElementById('breathingInstruction');
      const btn = document.getElementById('breathingBtn');
      if (circle) {
        circle.classList.remove('breathing-in', 'breathing-out');
        circle.textContent = '吸';
      }
      if (instruction) instruction.textContent = '准备开始...';
      if (btn) btn.textContent = '开始练习';
    }

    // 初始化鼓励卡片和励志语（页面加载时显示随机内容）
    function initRandomContent() {
      // 设置鼓励卡片
      const randomEncouragement = encouragements[Math.floor(Math.random() * encouragements.length)];
      document.getElementById('encouragementText').textContent = randomEncouragement;
      
      // 设置每日励志卡片
      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quoteTextCard').textContent = '"' + randomQuote.text + '"';
      
      // 同时更新下方的每日励志语
      document.getElementById('quoteText').textContent = '"' + randomQuote.text + '"';
    }

    // 收集爱心游戏
    let heartGameInterval = null;
    let score = 0;

    function openHeartCollector() {
      document.getElementById('heartCollector').classList.add('active');
    }

    function closeHeartCollector() {
      document.getElementById('heartCollector').classList.remove('active');
      stopHeartGame();
      score = 0;
      document.getElementById('heartScore').textContent = '0';
    }

    function startHeartGame() {
      if (heartGameInterval) {
        stopHeartGame();
        return;
      }

      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML = '';

      heartGameInterval = setInterval(() => {
        createClickableHeart();
      }, 1000);

      // 创建初始爱心
      for (let i = 0; i < 3; i++) {
        setTimeout(() => createClickableHeart(), i * 300);
      }
    }

    function stopHeartGame() {
      if (heartGameInterval) {
        clearInterval(heartGameInterval);
        heartGameInterval = null;
      }
    }

    function createClickableHeart() {
      const gameArea = document.getElementById('gameArea');
      const heart = document.createElement('div');
      heart.className = 'clickable-heart';
      heart.textContent = '💖';
      heart.style.left = Math.random() * (gameArea.offsetWidth - 40) + 'px';
      heart.style.top = Math.random() * (gameArea.offsetHeight - 40) + 'px';
      
      heart.onclick = function() {
        score++;
        document.getElementById('heartScore').textContent = score;
        this.style.transform = 'scale(2)';
        this.style.opacity = '0';
        setTimeout(() => this.remove(), 300);
      };

      gameArea.appendChild(heart);

      // 3秒后自动消失
      setTimeout(() => {
        if (heart.parentNode) {
          heart.style.opacity = '0';
          heart.style.transform = 'scale(0)';
          setTimeout(() => heart.remove(), 300);
        }
      }, 3000);
    }

    // 页面加载时初始化
    window.addEventListener('load', () => {
      initFloatingHearts();
      initParticles();
      initRandomContent();
    });
  </script>
</body>
</html>
