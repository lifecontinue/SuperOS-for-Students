<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Warm Space - SuperOS</title>
  <style>
    :root {
      --bg-main: #FAF9F6;
      --bg-card-1: #FAE2D8;
      --bg-card-2: #FDF1EB;
      --bg-card-3: #F5F1EE;
      --primary: #AA1E23;
      --primary-light: #74070E;
      --primary-dark: #4A0509;
      --text: #4A0509;
      --text-muted: #74070E;
      --border: rgba(170, 30, 35, 0.2);
      --warm-gradient: linear-gradient(135deg, #FAE2D8 0%, #FDF1EB 50%, #FAF9F6 100%);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body { 
      background: var(--warm-gradient);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
    }

    /* Floating Hearts Animation */
    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      color: rgba(170, 30, 35, 0.3);
      animation: float 15s infinite ease-in-out;
      opacity: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100px) translateX(100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(253, 241, 235, 0.8);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 15px rgba(170, 30, 35, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* Main Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    /* Welcome Card */
    .welcome-card {
      background: linear-gradient(135deg, rgba(250, 226, 216, 0.9), rgba(253, 241, 235, 0.9));
      border: 2px solid rgba(170, 30, 35, 0.2);
      border-radius: 24px;
      padding: 40px 30px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(170, 30, 35, 0.1);
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-emoji {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }

    .welcome-message {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 20px;
    }

    /* Activity Card */
    .activity-card {
      background: var(--bg-card-2);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: visible;
      animation: fadeInUp 0.8s ease-out;
      animation-fill-mode: both;
      min-height: 200px;
    }

    .activity-card:nth-child(1) { animation-delay: 0.1s; }

    .activity-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(170, 30, 35, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .activity-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 40px rgba(170, 30, 35, 0.15);
      border-color: var(--primary);
    }

    .activity-card:hover::before {
      opacity: 1;
    }

    .activity-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
      animation: floatIcon 3s infinite ease-in-out;
    }

    @keyframes floatIcon {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .activity-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .activity-description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Breathing Exercise Container - Full Screen Style */
    .breathing-container {
      background: linear-gradient(135deg, rgba(250, 226, 216, 0.95), rgba(253, 241, 235, 0.95));
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      position: relative;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-shadow: 0 12px 48px rgba(170, 30, 35, 0.15);
    }
    
    .breathing-container > * {
      flex-shrink: 0;
    }

    .breathing-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 0;
      margin-bottom: 30px;
      height: auto;
      line-height: 1.2;
    }

    /* Breathing Circle with Enhanced Animations */
    .breathing-circle {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      margin: 40px auto;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 700;
      box-shadow: 0 0 60px rgba(170, 30, 35, 0.4);
      position: relative;
      transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    /* Breathing In Animation - Expanding with glow */
    .breathing-circle.breathing-in {
      transform: scale(1.4);
      box-shadow: 0 0 80px rgba(170, 30, 35, 0.6), inset 0 0 40px rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, var(--primary), var(--primary-light), var(--primary));
      animation: breatheIn 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes breatheIn {
      0% {
        transform: scale(1);
        box-shadow: 0 0 60px rgba(170, 30, 35, 0.4);
      }
      100% {
        transform: scale(1.4);
        box-shadow: 0 0 100px rgba(170, 30, 35, 0.7), inset 0 0 50px rgba(255, 255, 255, 0.3);
      }
    }

    /* Breathing Hold Animation - Gentle pulse at full expansion */
    .breathing-circle.breathing-hold {
      transform: scale(1.4);
      box-shadow: 0 0 100px rgba(170, 30, 35, 0.7), inset 0 0 50px rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, var(--primary), var(--primary-light), var(--primary));
      animation: breatheHold 2s ease-in-out infinite;
    }

    @keyframes breatheHold {
      0%, 100% {
        transform: scale(1.4);
        box-shadow: 0 0 100px rgba(170, 30, 35, 0.7), inset 0 0 50px rgba(255, 255, 255, 0.3);
      }
      50% {
        transform: scale(1.42);
        box-shadow: 0 0 110px rgba(170, 30, 35, 0.75), inset 0 0 55px rgba(255, 255, 255, 0.35);
      }
    }

    /* Breathing Out Animation - Contracting with fade */
    .breathing-circle.breathing-out {
      transform: scale(1);
      box-shadow: 0 0 40px rgba(170, 30, 35, 0.3);
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      animation: breatheOut 6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes breatheOut {
      0% {
        transform: scale(1.4);
        box-shadow: 0 0 100px rgba(170, 30, 35, 0.7), inset 0 0 50px rgba(255, 255, 255, 0.3);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 50px rgba(170, 30, 35, 0.4);
      }
    }

    /* Pulsing rings effect for breathing */
    .breathing-circle::before,
    .breathing-circle::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      opacity: 0;
    }

    .breathing-circle.breathing-in::before {
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      animation: ringExpand 4s ease-out infinite;
    }

    .breathing-circle.breathing-hold::before {
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      animation: ringPulse 2s ease-in-out infinite;
    }

    .breathing-circle.breathing-out::after {
      width: 120%;
      height: 120%;
      top: -10%;
      left: -10%;
      animation: ringContract 6s ease-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% {
        transform: scale(1.4);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.3;
      }
    }

    @keyframes ringExpand {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    @keyframes ringContract {
      0% {
        transform: scale(1.2);
        opacity: 0.6;
      }
      100% {
        transform: scale(0.8);
        opacity: 0;
      }
    }

    .breathing-instruction {
      font-size: 20px;
      color: var(--text);
      margin-top: 30px;
      margin-bottom: 0;
      font-weight: 500;
      height: 80px;
      width: 100%;
      transition: opacity 0.8s ease-in-out, color 0.3s ease;
      opacity: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .breathing-instruction.fade-out {
      opacity: 0;
    }

    .breathing-instruction.fade-in {
      opacity: 1;
    }

    .breathing-instruction.breathing-in {
      color: var(--primary);
    }

    .breathing-instruction.breathing-hold {
      color: var(--primary-dark);
    }

    .breathing-instruction.breathing-out {
      color: var(--text-muted);
    }

    .breathing-circle-text {
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .breathing-circle-text.fade-out {
      opacity: 0;
    }

    .breathing-circle-text.fade-in {
      opacity: 1;
    }

    /* Button */
    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: inline-block;
      margin-top: 20px;
      margin-bottom: 0;
      position: relative;
      z-index: 1;
    }

    .btn:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      box-shadow: 0 6px 20px rgba(170, 30, 35, 0.3);
    }

    /* Close Button */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(170, 30, 35, 0.1);
      border: 2px solid var(--border);
      color: var(--primary);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .close-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: rotate(90deg) scale(1.1);
    }

    /* Daily Quote */
    .daily-quote {
      background: linear-gradient(135deg, rgba(250, 226, 216, 0.8), rgba(253, 241, 235, 0.8));
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .quote-icon {
      font-size: 48px;
      color: var(--primary);
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .quote-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 12px;
    }

    .quote-author {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(170, 30, 35, 0.3);
      border-radius: 50%;
      animation: particleFloat 20s infinite linear;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(100px);
        opacity: 0;
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .breathing-container {
        padding: 30px 20px;
        min-height: 550px;
      }

      .breathing-circle {
        width: 200px;
        height: 200px;
        font-size: 24px;
        margin: 30px auto;
      }

      .breathing-title {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .breathing-instruction {
        height: 70px;
        font-size: 18px;
        margin-top: 20px;
      }

      .btn {
        margin-top: 15px;
      }

      .welcome-card {
        padding: 30px 20px;
      }

      .welcome-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Floating Hearts -->
  <div class="floating-hearts" id="floatingHearts"></div>
  
  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo-section">
      <div class="logo-circle">💝</div>
      <div class="logo-text">Warm Space</div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Welcome Card -->
    <div class="welcome-card">
      <div class="welcome-emoji" id="welcomeEmoji">💕</div>
      <h1 class="welcome-title">Welcome to Warm Space</h1>
      <p class="welcome-message" id="welcomeMessage">
        Loading your personalized message...
      </p>
    </div>

    <!-- Breathing Exercise Container -->
    <div class="breathing-container" id="breathingContainer">
      <h2 class="breathing-title">🌬️ Breathing Exercise</h2>
      <div class="breathing-circle" id="breathingCircle">
        <span class="breathing-circle-text" id="breathingCircleText">Breathe</span>
      </div>
      <p class="breathing-instruction" id="breathingInstruction">Ready to begin...</p>
      <button class="btn" id="breathingBtn" onclick="startBreathing()">Start Exercise</button>
    </div>

    <!-- Daily Quote -->
    <div class="daily-quote">
      <div class="quote-icon">💭</div>
      <p class="quote-text" id="quoteText">"Every challenge is an opportunity for growth. You've come so far, and the future will be even better."</p>
      <p class="quote-author">— SuperOS Warm Space</p>
    </div>
  </div>

  <script>
    // Quotes Library
    const quotes = [
      { text: "Every challenge is an opportunity for growth. You've come so far, and the future will be even better.", author: "SuperOS Warm Space" },
      { text: "Don't worry about your current stress - it's just a catalyst making you stronger.", author: "SuperOS Warm Space" },
      { text: "Even the darkest night will have a dawn.", author: "SuperOS Warm Space" },
      { text: "Your efforts today are the foundation of tomorrow's success.", author: "SuperOS Warm Space" },
      { text: "Take a deep breath and relax. You're doing great.", author: "SuperOS Warm Space" },
      { text: "Stress is just part of life, but your smile can make everything beautiful.", author: "SuperOS Warm Space" },
      { text: "Remember, you're not fighting alone. We're all here to support you.", author: "SuperOS Warm Space" },
      { text: "Every smile is a victory over difficulty.", author: "SuperOS Warm Space" }
    ];

    // Initialize Floating Hearts
    function initFloatingHearts() {
      const container = document.getElementById('floatingHearts');
      const heartSymbols = ['💕', '💖', '❤️', '💗', '💝'];
      
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDelay = Math.random() * 15 + 's';
        heart.style.animationDuration = (10 + Math.random() * 10) + 's';
        container.appendChild(heart);
      }
    }

    // Initialize Particles
    function initParticles() {
      const container = document.getElementById('particles');
      
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        container.appendChild(particle);
      }
    }

    // Weather and Location API - Using free APIs
    async function getWeatherAndLocation() {
      try {
        // Get user location
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
        });
        
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        
        // Get location name using free Nominatim API (OpenStreetMap)
        let locationName = 'your area';
        try {
          const locationResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&addressdetails=1`);
          const locationData = await locationResponse.json();
          if (locationData && locationData.address) {
            locationName = locationData.address.city || 
                          locationData.address.town || 
                          locationData.address.village || 
                          locationData.address.county || 
                          'your area';
          }
        } catch (e) {
          console.log('Location name unavailable');
        }
        
        // Get weather data using Open-Meteo (free, no API key needed)
        const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code,temperature_2m&timezone=auto`);
        const weatherData = await weatherResponse.json();
        
        if (weatherData && weatherData.current) {
          const weatherCode = weatherData.current.weather_code;
          const temp = Math.round(weatherData.current.temperature_2m);
          
          // Convert WMO weather code to weather type
          const weatherType = getWeatherTypeFromCode(weatherCode);
          
          return {
            location: locationName,
            weather: weatherType,
            temp: temp,
            emoji: getWeatherEmoji(weatherType)
          };
        }
        
        return null;
      } catch (error) {
        console.log('Weather API unavailable, using fallback');
        return null;
      }
    }

    function getWeatherTypeFromCode(code) {
      // WMO Weather interpretation codes
      if (code === 0) return 'Clear';
      if (code >= 1 && code <= 3) return 'Clouds';
      if (code >= 45 && code <= 48) return 'Fog';
      if (code >= 51 && code <= 67) return 'Rain';
      if (code >= 71 && code <= 77) return 'Snow';
      if (code >= 80 && code <= 82) return 'Rain';
      if (code >= 85 && code <= 86) return 'Snow';
      if (code >= 95 && code <= 99) return 'Thunderstorm';
      return 'Clouds';
    }

    function getWeatherEmoji(weather) {
      const weatherEmojis = {
        'Clear': '☀️',
        'Clouds': '☁️',
        'Rain': '🌧️',
        'Drizzle': '🌦️',
        'Thunderstorm': '⛈️',
        'Snow': '❄️',
        'Mist': '🌫️',
        'Fog': '🌫️'
      };
      return weatherEmojis[weather] || '🌤️';
    }

    function generateWelcomeMessage(weatherData) {
      const messages = [];
      
      if (weatherData) {
        const { location, weather, temp, emoji } = weatherData;
        
        // Weather-based ice breakers
        if (weather === 'Clear') {
          messages.push(`It's a beautiful ${emoji} sunny day in ${location}! Perfect weather to take a moment and breathe.`);
          messages.push(`The sun is shining ${emoji} in ${location} today. Why not let its warmth inspire some calm breathing?`);
        } else if (weather === 'Clouds') {
          messages.push(`Cloudy skies ${emoji} in ${location} today - sometimes the best days are the quiet, peaceful ones.`);
          messages.push(`Those clouds ${emoji} above ${location} remind us that even soft moments can be beautiful.`);
        } else if (weather === 'Rain') {
          messages.push(`Rainy day ${emoji} in ${location} - the perfect soundtrack for a calming breathing session.`);
          messages.push(`The gentle rain ${emoji} in ${location} is like nature's way of saying "slow down and breathe."`);
        } else if (weather === 'Snow') {
          messages.push(`Snow falling ${emoji} in ${location} - each flake is unique, just like your breathing rhythm.`);
          messages.push(`A snowy day ${emoji} in ${location} - the perfect time to find warmth within through breathing.`);
        }
        
        // Temperature-based messages
        if (temp > 25) {
          messages.push(`It's ${temp}°C in ${location} - a warm day perfect for taking a refreshing breathing break!`);
        } else if (temp < 10) {
          messages.push(`It's ${temp}°C in ${location} - a cozy day to stay inside and focus on your breathing.`);
        }
      }
      
      // Fallback messages
      const fallbacks = [
        "I know you've been under pressure lately, but remember: you're doing great!",
        "This is a place filled with love and warmth, where you can relax and find peace.",
        "Every breath you take is a step toward calmness and clarity.",
        "You're not alone in this journey. Take a moment to breathe and reset.",
        "Sometimes the best thing we can do is simply pause and breathe."
      ];
      
      const selectedMessage = messages.length > 0 
        ? messages[Math.floor(Math.random() * messages.length)]
        : fallbacks[Math.floor(Math.random() * fallbacks.length)];
      
      return selectedMessage + " You're never alone. 💖";
    }

    async function updateWelcomeMessage() {
      const messageEl = document.getElementById('welcomeMessage');
      const emojiEl = document.getElementById('welcomeEmoji');
      
      const weatherData = await getWeatherAndLocation();
      const message = generateWelcomeMessage(weatherData);
      
      if (messageEl) {
        messageEl.textContent = message;
      }
      
      if (emojiEl && weatherData) {
        emojiEl.textContent = weatherData.emoji;
      }
    }

    // Breathing Exercise
    let breathingInterval = null;
    let isBreathing = false;
    let currentPhase = 'idle'; // idle, inhale, hold, exhale, rest

    function startBreathing() {
      const btn = document.getElementById('breathingBtn');
      if (isBreathing) {
        stopBreathing();
        if (btn) btn.textContent = 'Start Exercise';
        return;
      }

      isBreathing = true;
      if (btn) btn.textContent = 'I feel good';
      
      const circle = document.getElementById('breathingCircle');
      const instruction = document.getElementById('breathingInstruction');
      
      // Start breathing cycle
      runBreathingCycle(circle, instruction);
    }

    function updateTextSmooth(element, newText, className) {
      if (!element) return;
      
      // Fade out
      element.classList.add('fade-out');
      element.classList.remove('fade-in');
      
      setTimeout(() => {
        // Update text and class
        if (element.id === 'breathingCircleText') {
          element.textContent = newText;
        } else {
          element.textContent = newText;
        }
        
        // Remove old phase classes
        element.classList.remove('breathing-in', 'breathing-out', 'breathing-hold');
        
        // Add new phase class if provided
        if (className) {
          element.classList.add(className);
        }
        
        // Fade in
        element.classList.remove('fade-out');
        element.classList.add('fade-in');
      }, 400); // Half of transition time
    }

    function runBreathingCycle(circle, instruction) {
      if (!isBreathing) return;
      
      const circleText = document.getElementById('breathingCircleText');

      // Phase 1: Inhale (4 seconds) - Smooth expansion
      currentPhase = 'inhale';
      updateTextSmooth(circleText, 'INHALE', 'breathing-in');
      circle.classList.remove('breathing-out', 'breathing-hold');
      circle.classList.add('breathing-in');
      
      setTimeout(() => {
        updateTextSmooth(instruction, 'Breathe in slowly... Feel the air filling your body', 'breathing-in');
      }, 200);

      setTimeout(() => {
        if (!isBreathing) return;
        
        // Phase 2: Hold (2 seconds) - Gentle pulse at full expansion
        currentPhase = 'hold';
        updateTextSmooth(circleText, 'HOLD', 'breathing-hold');
        circle.classList.remove('breathing-in', 'breathing-out');
        circle.classList.add('breathing-hold');
        
        setTimeout(() => {
          updateTextSmooth(instruction, 'Hold... Feel the calm and peace', 'breathing-hold');
        }, 200);

        setTimeout(() => {
          if (!isBreathing) return;
          
          // Phase 3: Exhale (6 seconds) - Smooth contraction
          currentPhase = 'exhale';
          updateTextSmooth(circleText, 'EXHALE', 'breathing-out');
          circle.classList.remove('breathing-in', 'breathing-hold');
          circle.classList.add('breathing-out');
          
          setTimeout(() => {
            updateTextSmooth(instruction, 'Breathe out slowly... Release all stress and tension', 'breathing-out');
          }, 200);

          setTimeout(() => {
            if (!isBreathing) return;
            
            // Phase 4: Rest (2 seconds) - Brief pause
            currentPhase = 'rest';
            updateTextSmooth(circleText, 'REST', null);
            circle.classList.remove('breathing-in', 'breathing-out', 'breathing-hold');
            
            setTimeout(() => {
              updateTextSmooth(instruction, 'Rest... Prepare for the next breath', null);
            }, 200);

            setTimeout(() => {
              // Loop back to inhale for continuous cycle
              if (isBreathing) {
                runBreathingCycle(circle, instruction);
              }
            }, 2000);
          }, 6000);
        }, 2000);
      }, 4000);
    }

    function stopBreathing() {
      if (breathingInterval) {
        clearInterval(breathingInterval);
        breathingInterval = null;
      }
      isBreathing = false;
      currentPhase = 'idle';
      
      const circle = document.getElementById('breathingCircle');
      const instruction = document.getElementById('breathingInstruction');
      const btn = document.getElementById('breathingBtn');
      
      const circleText = document.getElementById('breathingCircleText');
      
      if (circle) {
        circle.classList.remove('breathing-in', 'breathing-out', 'breathing-hold');
        circle.style.transform = 'scale(1)';
        circle.style.animation = 'none';
        circle.style.boxShadow = '0 0 60px rgba(170, 30, 35, 0.4)';
      }
      if (circleText) {
        circleText.textContent = 'Breathe';
        circleText.classList.remove('breathing-in', 'breathing-out', 'breathing-hold', 'fade-out', 'fade-in');
      }
      if (instruction) {
        instruction.textContent = 'Ready to begin...';
        instruction.classList.remove('breathing-in', 'breathing-out', 'breathing-hold', 'fade-out', 'fade-in');
      }
      if (btn) btn.textContent = 'Start Exercise';
    }

    // Initialize random quote on page load
    function initRandomQuote() {
      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quoteText').textContent = '"' + randomQuote.text + '"';
    }

    // Initialize on page load
    window.addEventListener('load', () => {
      initFloatingHearts();
      initParticles();
      initRandomQuote();
      updateWelcomeMessage();
    });
  </script>
</body>
</html>
